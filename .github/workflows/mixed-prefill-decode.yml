name: Mixed prefill-decode validation

on:
  push:
    branches: [codex/mixed-prefill-decode-20261009]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source for offline CPU validation
        run: git archive --format=tar.gz HEAD > /tmp/neuron-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-source
          path: /tmp/neuron-source.tar.gz
          retention-days: 1
