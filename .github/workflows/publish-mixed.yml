name: Publish mixed implementation

on:
  push:
    branches: [codex/mixed-prefill-decode-20261009]
    paths: [.github/workflows/publish-mixed.yml]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mixed-prefill-decode-20261009
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply the locally tested patch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "c24aa2da7ca743b91310a43ee3d7ea9f7911a11d"
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/mixed-publish/patch.{i}.b64').read_text() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '708f25bafdf642216fc81bff9d9ac69ec5f4b08fac3ed9af7af67cabc7b24c7c'
          Path('/tmp/mixed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/mixed.patch
          git apply /tmp/mixed.patch
          rm -r .github/mixed-publish
          rm .github/workflows/publish-mixed.yml
      - name: Format new Python files only
        run: |
          python -m pip install ruff==0.14.0
          ruff format test/unit/mixed \
            test/vllm_neuron/model/glm5_next/tiny/test_tiny_glm5next_mixed.py \
            vllm_neuron/utils/mixed_batch.py \
            vllm_neuron/model/glm5_next/mixed_batch.py \
            vllm_neuron/vllm/worker/mixed_batch.py
      - name: Publish changes
        id: publish
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add opt-in GLM mixed prefill-decode'
          git push origin HEAD:codex/mixed-prefill-decode-20261009
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.4.2 numpy==2.2.6
      - name: Run mixed CPU contracts
        run: python -m pytest -q test/unit/mixed
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q vllm_neuron test/unit/mixed \
            test/vllm_neuron/model/glm5_next/tiny/test_tiny_glm5next_mixed.py
          git diff --check
      - name: Archive published source
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/neuron-mixed-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neuron-mixed-source
          path: /tmp/neuron-mixed-source.tar.gz
          retention-days: 1
